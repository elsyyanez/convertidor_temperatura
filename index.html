<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convertidor de temperatura</title>
  <meta name="application-name" content="Convertidor de temperatura">
  <meta name="theme-color" content="#fbe4ec">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon512.png">
  <link rel="stylesheet" href="converter.css">
</head>
<body>
  <!-- Barra de título personalizada: ocupa el área de la superposición de controles de ventana -->
  <header id="title-bar">
    <img src="icons/icon512.png" alt="" class="title-icon">
    <span class="title-text">Convertidor de temperatura</span>
    <span id="wco-status" class="wco-status" aria-live="polite"></span>
    <div class="title-actions">
      <button type="button" id="btn-swap" class="title-btn" aria-label="Intercambiar unidades" title="Intercambiar unidades (Alt+S)"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M7 4 3 8l4 4"/><path d="M3 8h14"/><path d="m17 20 4-4-4-4"/><path d="M21 16H7"/></svg></button>
      <button type="button" id="btn-copy" class="title-btn" aria-label="Copiar resultado" title="Copiar resultado (Alt+C)"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg></button>
      <button type="button" id="btn-share" class="title-btn" aria-label="Compartir resultado" title="Compartir resultado (Alt+P)"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4"/><path d="m15.4 6.5-6.8 4"/></svg></button>
      <button type="button" id="btn-reset" class="title-btn" aria-label="Restablecer" title="Restablecer (Alt+R)"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button type="button" id="btn-theme" class="title-btn" aria-label="Cambiar tema" title="Tema claro / oscuro (Alt+T)"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
      <button type="button" id="btn-full" class="title-btn" aria-label="Pantalla completa" aria-pressed="false" title="Pantalla completa (F11)"><svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M8 3H3v5"/><path d="M16 3h5v5"/><path d="M21 16v5h-5"/><path d="M3 16v5h5"/></svg></button>
    </div>
  </header>

  <main>
    <h1>Convertidor de temperatura</h1>
    <form id="converter" onsubmit="return false">
      <label for="input-temp">Temperatura</label>
      <input type="number" id="input-temp" value="22" step="any" inputmode="decimal">

      <label for="input-unit">Desde</label>
      <select id="input-unit">
        <option value="c" selected>Celsius</option>
        <option value="f">Fahrenheit</option>
        <option value="k">Kelvin</option>
      </select>

      <label for="output-unit">Hacia</label>
      <select id="output-unit">
        <option value="c">Celsius</option>
        <option value="f" selected>Fahrenheit</option>
        <option value="k">Kelvin</option>
      </select>

      <output id="output-temp" for="input-temp input-unit output-unit">71,6 F</output>
    </form>
  </main>

  <script src="converter.js"></script>
</body>
</html>
